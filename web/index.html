<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Cloud Phone</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 15px -apple-system, system-ui, sans-serif; overflow: hidden; }
    video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    .panel { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; background: rgba(0,0,0,.75); text-align: center; }
    .panel[hidden], #stats[hidden] { display: none; }
    input, button { font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid #444; background: #1c1c1e; color: #eee; }
    button { background: #0a84ff; border-color: #0a84ff; color: #fff; }
    #stats { position: fixed; top: env(safe-area-inset-top, 8px); left: 8px; padding: 6px 8px; border-radius: 8px; background: rgba(0,0,0,.6); font: 12px ui-monospace, monospace; white-space: pre; pointer-events: none; }
    #status { color: #aaa; }
  </style>
</head>
<body>
  <video id="screen" autoplay playsinline muted></video>

  <form id="login" class="panel" hidden>
    <label for="token">Jeton d'accès</label>
    <input id="token" type="password" autocomplete="current-password" required>
    <button type="submit">Se connecter</button>
  </form>

  <div id="overlay" class="panel">
    <div id="status">Connexion…</div>
    <button id="start" hidden>Toucher pour activer le son</button>
  </div>

  <div id="stats" hidden></div>

  <script type="module" src="dist/app.js"></script>
</body>
</html>
